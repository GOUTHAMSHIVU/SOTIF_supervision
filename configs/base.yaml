# ==============================================================================
# SOTIF supervision: Base Environment & Path Configuration
# ==============================================================================

project:
  name: "SOTIF_supervision"
  version: "1.0.0"
  seed: 42

# ------------------------------------------------------------------------------
# Storage Root Resolution:
# Resolves ${oc.env:STORAGE_ROOT} if present; otherwise falls back to default.
# ------------------------------------------------------------------------------

storage:
  # Base directory on external disk
  root: "${oc.env:STORAGE_ROOT,D:/SOTIF_supervision_workspace}"
  
  # Data directories
  data_dir: "${storage.root}/data"
  raw_dir: "${storage.data_dir}/raw"
  features_dir: "${storage.root}/features"
  
  # Precomputed HDF5 Feature Files
  features:
    feature_h5: "${storage.features_dir}/train_features.h5"
    # ood_h5: "${storage.features_dir}/features_ood.h5"
    # weather_h5: "${storage.features_dir}/features_weather.h5"
    
  # Checkpoints and Trained Model Weights
  models_dir: "${storage.root}/models"
  head_a_weights: "${storage.models_dir}/head_a_vae_best.pt"
  head_b_weights: "${storage.models_dir}/head_b_regressor_best.pt"
  
  # MLflow & Experiment Tracking on External Drive
  mlflow:
    tracking: true
    tracking_uri: "sqlite:///${storage.root}/mlflow.db"
    artifact_root: "${storage.root}/mlflow_artifacts"
    experiment_name: "SOTIF_Supervisors"

# ------------------------------------------------------------------------------
# Global Hardware & Compute Defaults
# ------------------------------------------------------------------------------
compute:
  device: "cuda"          # "cuda" or "cpu"
  num_workers: 0          # Note: Keep 0 on Windows for HDF5 multiprocessing safety
  pin_memory: true
  fp16_enabled: false     # VAE loss stability is better in fp32