[project]
name = "SOTIF_supervision"
version = "0.1.0"
description = "SOTIF-Aware Dual-Head Perception Supervisor for Autonomous Driving"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Core DL & Tensors
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24.0,<2.0.0",
    "h5py>=3.10.0",
    
    # Image Operations & Corruptions
    "opencv-python-headless>=4.8.0",
    "albumentations>=1.4.0",
    "Pillow>=10.0.0",
    
    # Mathematical Modeling & Latent Metrics
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    
    # Configuration & Tooling
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    
    # MLOps & Experiment Tracking
    "mlflow>=2.11.0",
    "dvc>=3.48.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "torchview>=0.2.6"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]